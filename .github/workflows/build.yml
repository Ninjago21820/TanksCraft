name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Publish build log (on failure)
        if: failure()
        run: |
          tail -c 400000 build.log > /tmp/trimmed.log || true
          { grep -nE "error:|FAILED|FAILURE|Caused by|\.java:[0-9]+" build.log | head -300; } > /tmp/errors.txt || true
          git config --global user.name "ci-bot"
          git config --global user.email "ci-bot@users.noreply.github.com"
          rm -rf /tmp/ci-logs && mkdir -p /tmp/ci-logs && cd /tmp/ci-logs
          git init -q .
          cp /tmp/trimmed.log build.log
          cp /tmp/errors.txt . 2>/dev/null || true
          echo "$GITHUB_SHA" > sha.txt
          git add -A
          git commit -qm "log $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-logs

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tankscraft-jar
          path: build/libs/*.jar

      - name: Update pre-release (session branch)
        if: success() && github.ref == 'refs/heads/arena/01a09a8d-tankscraft'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-latest -y --cleanup-tag || true
          gh release create build-latest --prerelease \
            --title "TanksCraft — build ${GITHUB_SHA::7}" \
            --notes "Compilation automatique de la branche de développement. Installer sur NeoForge 1.21.1 (Java 21)." \
            build/libs/tankscraft-*.jar
